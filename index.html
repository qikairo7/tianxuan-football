<style>
:root{
  --bg:#0e1220; --bg2:#141a2e; --card:#171d31; --card2:#1d2440;
  --ink:#eef1f8; --muted:#9aa2b1; --line:#2a3350;
  --blue:#4f7cff; --green:#22b573; --gold:#f5b93d; --red:#ff6b6b; --purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  line-height:1.65;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:640px;margin:0 auto}
/* 顶栏 */
#topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:linear-gradient(180deg,#1a2138,#141a2e);
  border-bottom:1px solid var(--line)}
#topbar .logo{font-weight:800;font-size:15px;letter-spacing:.5px}
#topbar .logo b{color:var(--gold)}
#topbar .stats{font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
#topbar .stats .big{color:var(--ink);font-weight:700;font-size:13px}
#topbar button{background:var(--card2);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
/* 剧情区 */
#stage{flex:1 1 auto;overflow-y:auto;padding:14px 14px 8px;-webkit-overflow-scrolling:touch;
  background:radial-gradient(1200px 400px at 50% -100px,#1a2140,transparent)}
#log{display:flex;flex-direction:column;gap:6px}
.msg{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.6}
.msg .narr{padding-left:4px}
.msg.hr{color:var(--gold);font-weight:800;letter-spacing:1px;margin-top:8px;padding:6px 10px;
  background:linear-gradient(90deg,rgba(245,185,61,.12),transparent);border-left:3px solid var(--gold);
  border-radius:4px;font-size:14px}
.msg.decision{margin-top:12px;padding:12px 12px 4px;background:var(--card);border:1px solid var(--line);
  border-radius:12px}
.msg.decision .d-title{color:var(--gold);font-weight:800;margin-bottom:4px;font-size:15px}
.msg.decision .d-body{color:var(--muted);font-size:13.5px;margin-bottom:6px}
.msg.info{color:var(--muted);font-size:13px}
.msg.good{color:var(--green)}
.msg.bad{color:var(--red)}
.msg.warn{color:var(--gold)}
.msg.panel{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
/* 决策按钮 */
#choices{flex:0 0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  background:#11162a;max-height:46vh;overflow-y:auto}
#choices .btn{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;
  background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:12px;
  font-size:14.5px;cursor:pointer;position:relative}
#choices .btn:active{transform:scale(.98);background:#26304f}
#choices .btn .lbl{font-weight:700;color:var(--blue)}
#choices .btn .desc{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
#choices .btn .key{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
/* 底部复用 */
#bottom{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#11162a}
#bottom button{flex:1;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
@media(min-width:640px){ body{font-size:15px} }
</style>
</head>

/* ================= 通用工具 ================= */
const rand  = Math.random;
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function randint(a,b){ return Math.floor(rand()*(b-a+1))+a; }
function choice(arr){ return arr[Math.floor(rand()*arr.length)]; }
function uniform(a,b){ return a+rand()*(b-a); }
function gauss(mu,sigma){ let u=0,v=0; while(u===0)u=rand(); while(v===0)v=rand();
  return mu+sigma*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function sample(arr,k){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a.slice(0,k); }
function choices(arr,weights){ let total=weights.reduce((s,w)=>s+w,0); let r=rand()*total;
  for(let i=0;i<arr.length;i++){ r-=weights[i]; if(r<=0) return arr[i]; } return arr[arr.length-1]; }
function poisson(lam){ if(lam<=0) return 0; const L=Math.exp(-lam); let k=0,p=1;
  while(true){ p*=rand(); if(p<=L) return k; k++; if(k>30) return 30; } }
function strhash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
function star(v){ for(const b of CFG.star_bands){ if(b.min<=v&&v<=b.max) return b.star+' '+b.label; } return '?'; }
function starShort(v){ return star(v).slice(0,5); }
function fmtWan(v){ if(v>=10000) return (v/10000).toFixed(2)+' 亿欧'; return Math.round(v)+' 万欧'; }
function fmt(v,dec){ return v.toFixed(dec===undefined?2:dec); }

/* ================= 数值公式 ================= */
function sp_cost(v){ for(const b of CFG.growth.attribute_cost){ if(b.min<=v&&v<=b.max) return b.cost; } return null; }
function age_curve_coef(age){ const c=CFG.growth.coefficients["年龄曲线_天选之子"];
  if(age>=16&&age<=18)return c["16-18"]; if(age>=19&&age<=22)return c["19-22"];
  if(age>=23&&age<=26)return c["23-26"]; if(age>=27&&age<=30)return c["27-30"];
  if(age>=31&&age<=33)return c["31-33"]; if(age>=34&&age<=37)return c["34-37"]; return c["38-40"]; }
function season_sp_income(p){
  const apps=p.apps; const app_c=apps>=30?1.2:(0.04*apps);
  const avg=p.ratings.length?(p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length):6.0;
  const form_c=avg>=7.5?1.3:(avg<6.3?0.8:1.0);
  const morale_c=p.morale>=115?1.2:(p.morale<70?0.7:1.0);
  const plan=p.training_plan||"体能储备";
  const aligned=CFG.playstyles[p.playstyle].aligned_training.includes(plan);
  const fit_c=aligned?1.2:0.8;
  const age_c=age_curve_coef(p.age);
  const income=Math.round(CFG.growth.sp_base_per_season*app_c*form_c*morale_c*fit_c*age_c);
  const detail=`出场×${app_c.toFixed(2)}(${apps}场) · 状态×${form_c}(均分${avg.toFixed(2)}) · 士气×${morale_c} · 契合×${fit_c}(${aligned?'对齐':'错配'}) · 年龄×${age_c}`;
  return [income,detail];
}
function allocate_sp(p,ratio=1.0,silent=false){
  const [total,detail]=season_sp_income(p); const grant=Math.round(total*ratio); p.sp+=grant;
  if(!silent){ hr("成长点结算"+(ratio<1?"（冬窗预支 40%）":"")); narr(`公式：${detail}`); narr(`→ 获得 ${grant} SP（持有 ${p.sp}）。成本：75-84需2 85-89需3 90-94需5 95-98需8`); }
  let plan_rules={"身体改造":["强壮","强壮","强壮","弹跳","耐力"],"终结特训":["射门","远射","点球","射门","射门"],
    "盘带强化":["盘带","技术","灵活","盘带","技术"],"定位球大师":["任意球","传中","点球","任意球"],
    "体能储备":["耐力","强壮","速度","耐力"],"战术理解":["预判","决断","团队合作","领导力"]}[p.training_plan]||["强壮","射门","耐力"];
  if(p.age>=30) plan_rules=["预判","镇定","决断","视野","领导力","射门"];
  const spent=[]; let guard=0;
  while(p.sp>0&&guard<400){ guard++; let progressed=false;
    for(const key of plan_rules){ if(p.sp<=0)break; const cost=sp_cost(p.attr[key]);
      if(cost!==null&&cost<=p.sp){ p.sp-=cost; p.attr[key]+=1; spent.push(key); progressed=true; } }
    if(!progressed)break; }
  if(!silent) narr(`[成长分配] 自动分配：${spent.join("/")}（留存 ${p.sp} SP）`);
  return grant;
}
function market_value_wan(p){
  const mv=CFG.market_value_baseline_wan_eur, ages=mv.ages, bands=mv.ca_bands, table=mv.table;
  const ca=p.ca(), age=clamp(p.age,ages[0],ages[ages.length-1]);
  const lo=Math.max.apply(null,ages.filter(a=>a<=age)); const hi=Math.min.apply(null,ages.filter(a=>a>=age));
  const c_lo=Math.max.apply(null,bands.filter(c=>c<=ca).concat([bands[0]])); const c_hi=Math.min.apply(null,bands.filter(c=>c>=ca).concat([bands[bands.length-1]]));
  function cell(a){ const r=table[String(a)]; const il=bands.indexOf(c_lo),ih=bands.indexOf(c_hi);
    if(il===ih)return r[il]; return r[il]+(r[ih]-r[il])*(ca-c_lo)/(c_hi-c_lo); }
  const r_lo=cell(lo),r_hi=cell(hi);
  const base=hi===lo?r_lo:(r_lo+(r_hi-r_lo)*(age-lo)/(hi-lo));
  const power=(CFG.leagues[p.league]||{购买力:0.5}).购买力||0.5;
  const premium=p.age<23?CFG.growth.potential_premium_age_lt_23:1.0;
  const looks=p.looks>=95?1.15:1.0;
  return base*power*premium*looks*1.1;
}

function simulate_match(p,comp,importance=0,derby=null){
  if(rand()<0.08){ p.missed+=1; narr(`[${comp}] 你本场未进入大名单（${p.role}）。在看台上观察对手，记了满满一页笔记。`); return null; }
  const opp=derby||choice(opp_pool(p));
  const derby_on=derby!==null||is_derby(p,opp);
  if(derby_on){ importance=Math.max(importance,1); p.pressure=clamp(p.pressure+8,0,100); narr(`  🔥 德比战！${p.club} vs ${opp} —— 全城目光都在这座球场。压力槽 +8。`); }
  const os_=opp_strength(opp,p), st=opp_style(opp);
  const opp_factor=clamp(1-(os_-50)/50*0.4,0.6,1.15);
  const lm=(CFG.leagues[p.league]||{mods:{}});
  const compat=p.playstyle_compat()/100.0, dmod=p.directive_mod();
  const press=p.tactical.press;
  const press_boost=press==="高位"?0.08:(press==="低位"?-0.05:0);
  const style_boost=st.name==="高位逼抢"?0.06:(st.name==="摆大巴"?-0.04:0);
  const rot=p.tactical.rotation;
  const rot_mod={"主力死磕":{lam:1.02,fat:1.25,inj:1.15},"保护性轮换":{lam:0.95,fat:0.7,inj:0.8},"适度轮换":{lam:1.0,fat:1.0,inj:1.0}}[rot];
  const base_ca=(p.ca()-70)*0.035;
  const mindset=p.mindset_mod()+p.form_mod()+p.energy_mod()+p.fatigue_mod()+p.on_fire_mod();
  const compat_mod=(compat-0.6)*0.25;
  const pressure_penalty=p.pressure>=80?-0.10:(p.pressure>=60?-0.05:0);
  let perf=base_ca+mindset+compat_mod+pressure_penalty+gauss(0,0.35)+importance*0.15;
  perf+=(50-os_)*0.012;
  if(derby_on) perf+=p.hidden["大赛发挥"]/400.0;
  const rating=clamp(Math.round((6.2+perf+uniform(0,0.4))*10)/10,4.0,10.0);
  const boost=1+p.mindset_mod()+p.form_mod()+p.fatigue_mod()+p.on_fire_mod()+importance*0.3;
  const shoot=p.attr["射门"]; const shoot_factor=1+Math.max(0,shoot-80)*0.05;
  let lam_g=shoot*0.008*shoot_factor*boost*compat*dmod.lam*opp_factor*st.att*rot_mod.lam;
  lam_g*=Math.pow(lm.mods["出场机会"]||1.0,0.2);
  const lam_a=p.attr["视野"]*0.006*boost*compat*opp_factor;
  const my_shots=poisson(Math.max(0.0,lam_g*2.2));
  let goals=0,on_target=0;
  const x_per=lam_g/Math.max(1,my_shots);
  for(let i=0;i<my_shots;i++){ const on=rand()<0.5; if(on)on_target++; if(rand()<x_per*(on?1.0:0.55)) goals++; }
  let assists=0; const na=poisson(lam_a); for(let i=0;i<na;i++) if(rand()<0.8) assists++;

function negotiate_transfer(p,offer,auto=null){
  const value=market_value_wan(p);
  let fee=Math.round(value*offer.boost*(1+p.agent_bonus()));
  let tension=25, rounds=0, fee_locked=false;
  return ask("转会报价",[`${offer.club}（${offer.tag}·${offer.league}）报价 ${fmtWan(fee)}（你的身价 ${fmtWan(value)}）。`],
    [["接受报价",`锁定 ${fmtWan(fee)}`],[`还价 +20%（${fmtWan(Math.round(fee*1.2))}）`,"张力+25，买家可能接受或走人"],[`狮子大开口 +45%（${fmtWan(Math.round(fee*1.45))}）`,"张力+40，谈崩风险高"],["拒绝报价，留在"+p.club,"忠诚线，终止谈判"]],auto===null?0:auto).then(first=>{
    const step=(idx,autoIdx)=>{
      if(idx===0){ fee_locked=true; narr(`  → 你点头。${fmtWan(fee)} 这个数字，足够体面。`); return proceed(); }
      if(idx===3){ narr("  → 你把报价单推回去：'不了。'"); return Promise.resolve(null); }
      const ratio=idx===1?25:40; tension+=ratio; narr(`  → 你的经纪人开口还价（张力 +${ratio}）。`);
      if(rand()<(idx===1?0.55:0.30)){ fee=Math.round(fee*(idx===1?1.2:1.45)); fee_locked=true; narr(`  → ${offer.club} 沉默片刻，咬牙接受 ${fmtWan(fee)}！`); return proceed(); }
      if(tension>=100||rand()<0.35){ narr(`  → 谈判破裂。${offer.club} 的人起身走了。`); return proceed_after_broke(); }
      fee=Math.round(fee*1.1); tension+=10; narr(`  → 买家不肯让步太多，只加到 ${fmtWan(fee)}（张力 +10）。`); return step(0,autoIdx);
    };
    const proceed_after_broke=()=>Promise.resolve(null);
    const proceed=()=>{
      if(rand()<0.35){
        const others=_transfer_suitors(p).filter(s=>s.club!==offer.club);
        const rival=others.length?choice(others):offer;
        narr(`  ⚡ 消息走漏！${rival.club} 的报价连夜送到，竞价开启！`); tension+=20; _tension_bar(tension);
        const old_fee=fee; fee=Math.round(fee*1.15); narr(`  竞价后转会费飙至 ${fmtWan(fee)}（原 ${fmtWan(old_fee)}）。`);
        return ask("竞价抉择",[`${rival.club}（${rival.league}·${rival.tag}）入场，转会费水涨船高。`],
          [[`转投${rival.club}`,`接收 ${fmtWan(fee)} 报价`],[`坚持${offer.club}`,`原买家 ${fmtWan(fee)} 匹配`],["让两家继续竞（张力+25）","费再+10%，可能都走人"]],auto===null?0:auto).then(ridx=>{
          if(ridx===2){ fee=Math.round(fee*1.10); tension+=25; _tension_bar(tension);
            if(tension>=100||rand()<0.3){ narr("  → 竞到最高处，两家都冷静下来。交易黄了。"); return Promise.resolve(null); }
            narr(`  最终 ${fmtWan(fee)}。竞价落锤。`); }
          if(ridx===0) offer=rival;
          return personal();
        });
      }
      return personal();
    };
    const personal=()=>{
      const wage=Math.round(Math.max(2,value*0.002*offer.wage_scale));
      const bonus=Math.round(wage*12); const years=randint(3,5);
      const release=(offer.tag==="跳板"||offer.tag==="五大中游")?Math.round(value*1.5):null;
      hr("个人条款"); narr(`  周薪 ${wage}万 | 签字费 ${fmtWan(bonus)} | 合同 ${years} 年${release?" | 解约金 "+fmtWan(release):""}`);
      return ask("个人条款",["桌上的合同与你的人生方向有关。"],
        [["接受条款","尘埃落定"],[`要求更高周薪（+${Math.round(wage*0.5)}万）`,"可能被砍签字费"],["要解约金条款","周薪 -1万，留后路"],["谈崩","一拍两散"]],auto===null?0:auto).then(pidx=>{
        if(pidx===3){ narr("  → 你推开合同。这桩转会就此作罢。"); return null; }
        if(pidx===1){ if(rand()<0.5){ p.wage=wage; narr(`  → 他们加薪了：周薪 ${wage+ (wage*0.5)}万。签字费不变。`); } else { narr(`  → 周薪不松口，签字费被砍到 ${fmtWan(bonus*0.6)}。`); } }
        else if(pidx===2){ narr(`  → 解约金 ${fmtWan(value*1.5)} 写进合同。周薪 ${wage-1}万。`); }
        narr(`  ✅ 你与 ${offer.club} 达成一致。转会费 ${fmtWan(fee)}。`);
        return {club:offer.club,league:offer.league,tag:offer.tag,fee,wage,bonus,release,years};
      });
    };
    // 首回合：进入还价循环
    const autoIdx=auto===null?0:auto;
    return step(first,autoIdx);
  });
}

<script>
/* =====================================================================
   《天选之子》续篇：转会执行 / 赛季流程 / 国家队 / 欧冠 / 世界杯 /
   金球奖 / 财务 / 成就 / 退役 / 执教 / 存档 / Game 状态机
   ===================================================================== */

/* ---------- 转会执行 ---------- */
function _apply_transfer(p, res){
  const old_club=p.club;
  p.set_club(res.club,res.league);
  p.wage=res.wage; p.signing_bonus=res.bonus; p.release_clause=res.release; p.contract_years=res.years;
  const rep={"顶级豪门":30,"五大中游":25,"跳板":20,"天价土豪":-5}[res.tag]||15;
  p.reputation=clamp(p.reputation+rep,0,100);
  if(res.tag==="天价土豪"){ p.brand+=30; narr(`  → 你接下了天价合同。欧洲球探的笔记合上了，但账户数字很漂亮。`); }
  else if(res.tag==="顶级豪门"){ narr(`  → 你登陆了真正的豪门。更衣室里是欧冠冠军的合照。`); }
  else if(res.tag==="五大中游"){ narr(`  → 你登陆 ${res.league}。劳工证艰难地批了下来——'潜力巨大'，审查官写道。`); }
  else { narr(`  → 你踏上了 ${res.league} 的土地。`+(p.hidden["适应性"]>=75?"适应得飞快。":"一切都很陌生。")); }
  if(p.hidden["适应性"]>=75) p.set_mindset("兴奋",2); else p.set_mindset("焦虑",1);
  narr(`  新合同：周薪 ${p.wage}万 | 签字费 ${fmtWan(p.signing_bonus)} | 剩余 ${p.contract_years} 年`+(p.release_clause?` | 解约金 ${fmtWan(p.release_clause)}`:""));
  narr(`  身价已重估：${market_value(p)}（转会费 ${fmtWan(res.fee)} 载入你的档案）。`);
  p.transfer_log.push({year:p.year,from:old_club,to:res.club,league:res.league,fee_wan:res.fee,tag:res.tag});
}
function _renew_contract(p){
  const value=market_value_wan(p);
  const fair=Math.round(Math.max(2,value*0.0016));
  if(p.contract_years>1 && p.wage>=fair*0.7){ narr(`  ${p.club} 与你合同还剩 ${p.contract_years} 年、周薪 ${p.wage}万，续约无波无澜。`); return Promise.resolve(); }
  hr(`续约谈判 · ${p.club}`);
  const offer_wage=Math.max(p.wage,fair);
  const new_years=(p.contract_years<=1)?4:(p.contract_years+1);
  narr(`${p.club} 提出续约：周薪 ${offer_wage}万，${new_years} 年。`);
  return ask("续约条款",[`你当前周薪 ${p.wage}万，合同剩 ${p.contract_years} 年。`],
    [("接受",`周薪 → ${offer_wage}万`),(`要求更高（${offer_wage+2}万`,"董事会关系风险"),("暂不续约","明夏自由身，博更大舞台")],0).then(idx=>{
    if(idx===0){ p.wage=offer_wage; p.contract_years=new_years; narr(`  → 续约成功。你安心把心留在 ${p.club}。`); p.morale=clamp(p.morale+8,0,130); }
    else if(idx===1){ if(rand()<0.5){ p.wage=offer_wage+2; p.contract_years=new_years; narr(`  → 董事会点头了。周薪 ${p.wage}万。`); } else { narr("  → 董事会冷脸：'年轻人别太贪。' 续约搁置。"); p.trust=clamp(p.trust-5,0,100); } }
    else { p.flags["合同待定"]=true; narr("  → 你把续约押后。经纪人暗示明年会有更大的舞台。"); }
  });
}

/* ---------- 赛季目标与绩效 ---------- */
function set_season_goals(p, season){
  hr("阶段一 · 赛季目标（老板/教练拍板）");
  const coach=p.coach.name;
  const goals=[];
  const prestige=(CFG.leagues[p.league]||{prestige:40}).prestige||40;
  const goal_factor=clamp(prestige/40.0,1.0,2.2);
  const base_goals=(p.role==="核心"||p.role==="主力")?6:4;
  goals.push({type:"进球",target:Math.max(3,Math.round(base_goals*goal_factor)),desc:`联赛进球 ≥ ${Math.max(3,Math.round(base_goals*goal_factor))} 粒`});
  const avg_target=Math.round((p.ca()>=78?6.8:6.4)*10)/10;
  goals.push({type:"均分",target:avg_target,desc:`场均评分 ≥ ${avg_target.toFixed(1)}`});
  const apps_target=(p.role==="核心"||p.role==="主力")?22:15;
  goals.push({type:"出场",target:apps_target,desc:`赛季出场 ≥ ${apps_target} 场`});
  if((p.league==="中甲"||p.league==="中超")&&p.reputation>=70){ goals.push({type:"排名",target:3,desc:"带队进入联赛前 3"}); }
  p.season_goals=goals;
  narr(`${coach} 把你叫进办公室，赛季目标写在战术板上：`);
  for(const g of goals) narr(`  · ${g.desc}`);
  if(p.role==="核心"||p.role==="主力") narr("  '你是这支球队的答案。别让我们失望。'");
  else narr("  '先站稳脚跟，再谈野心。'");
  if(p.season_grade==="C"){ narr("  '上赛季的评级……我不希望再看到。'"); p.pressure=clamp(p.pressure+10,0,100); }
}
function _goal_progress(g,p,avg){
  if(g.type==="进球") return [p.goals,g.target,g.target?p.goals/g.target:1];
  if(g.type==="助攻") return [p.assists,g.target,g.target?p.assists/g.target:1];
  if(g.type==="出场") return [p.apps,g.target,g.target?p.apps/g.target:1];
  if(g.type==="均分") return [Math.round(avg*100)/100,g.target,g.target?(avg/g.target):1];
  if(g.type==="排名") return [(p.last_rank||99),g.target,null];
  return [0,g.target,1];
}
function progress_check(p){
  if(!p.season_goals) return;
  hr("阶段三 · 中期评估（教练催办）");
  const avg=p.ratings.length?(p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length):0;
  const behind=[];
  for(const g of p.season_goals){
    if(g.type==="排名") continue;
    const [cur,need,pace]=_goal_progress(g,p,avg);
    if(pace>=0.55) narr(`  ✓ ${g.desc}：目前 ${cur}（进度 ${Math.round(pace*100)}%，在轨道上）`);
    else if(pace>=0.3){ narr(`  ~ ${g.desc}：目前 ${cur}（进度 ${Math.round(pace*100)}%，要加把劲）`); behind.push(g); }
    else { narr(`  ✗ ${g.desc}：目前 ${cur}（进度 ${Math.round(pace*100)}%，严重滞后）`); behind.push(g); }
  }
  if(behind.length){ narr("  '你不是为了让我在董事会上难堪才来的吧？下半程给我把命拼上。'"); p.pressure=clamp(p.pressure+12,0,100); p.set_mindset("紧张",2); narr("  压力槽 +12。"); }
  else { narr("  '很好，继续保持。'"); p.trust=clamp(p.trust+8,0,100); p.morale=clamp(p.morale+5,0,130); }
}
function evaluate_season(p){
  if(!p.season_goals) return;
  hr("阶段五 · 赛季绩效评估（评级）");
  const avg=p.ratings.length?(p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length):0;
  const results=[];
  for(const g of p.season_goals){
    const [cur,need,pace]=_goal_progress(g,p,avg);
    let done;
    if(g.type==="排名") done=!!p.last_rank&&p.last_rank<=need;
    else done=cur>=need;
    narr((done?"  ✓ ":"  ✗ ")+`${g.desc}（达成：${cur} / 目标 ${need}）`);
    results.push(done?1:0);
  }
  const ratio=results.length?(results.reduce((a,b)=>a+b,0)/results.length):0;
  let grade,note;
  if(ratio>=0.9){grade="S";note="无可挑剔";} else if(ratio>=0.65){grade="A";note="超预期";} else if(ratio>=0.4){grade="B";note="及格";} else {grade="C";note="令人失望";}
  p.season_grade=grade;
  narr(`  → 赛季评级：${grade}（${note}）—— 完成 ${results.reduce((a,b)=>a+b,0)}/${results.length} 项目标`);
  if(grade==="S"){ p.morale=clamp(p.morale+15,0,130); p.trust=clamp(p.trust+10,0,100); p.reputation=clamp(p.reputation+5,0,100); narr("  '董事会已经为你准备好了新合同。'"); }
  else if(grade==="A"){ p.morale=clamp(p.morale+10,0,130); p.trust=clamp(p.trust+5,0,100); narr("  '超出预期。我们把目标定得更高些。'"); }
  else if(grade==="B"){ narr("  '及格。但这不是我们招你来的目的。'"); }
  else { p.morale=clamp(p.morale-15,0,130); p.trust=clamp(p.trust-10,0,100); p.reputation=clamp(p.reputation-5,0,100); p.pressure=clamp(p.pressure+15,0,100); narr("  '下赛季，我需要看到脱胎换骨的你。'"); }
}
function rest_decision(p){
  if(p.fatigue<55) return;
  return ask("疲劳管理",[`疲劳值 ${p.fatigue}。队医盯着你的腿：'再这么踢下去，膝盖会哭。'`],
    [("轮休一场","疲劳-35，精力+25；缺阵 1 场"),("坚持出战","疲劳+8，受伤风险+；状态可能崩")],0).then(idx=>{
    if(idx===0){ p.missed+=1; p.recover(); narr("  → 你坐在替补席，看着队友踢完这一场。腿终于歇了歇。"); }
    else { p.tick_fatigue(8); narr("  → 你决定咬牙上场。教练在教练席上摇了摇头。"); }
  });
}
function transfer_market_view(p, suitors){
  hr("转会市场 · 球探报告");
  const ca=p.ca();
  const potential=(p.hidden["职业素养"]||80)/100.0;
  const score=ca*0.7+(100-clamp(p.age,16,34))*0.5*potential+p.brand*0.2+p.reputation*0.3;
  let grade,grade_cn;
  if(score>=170){grade="S";grade_cn="世界级妖星";} else if(score>=140){grade="A";grade_cn="顶级即战力";} else if(score>=110){grade="B";grade_cn="五大主力水平";} else if(score>=85){grade="C";grade_cn="轮换/潜力股";} else {grade="E";grade_cn="刚起步";}
  narr(`  📋 球探评级：${grade}（${grade_cn}）· CA ${ca} · ${p.age} 岁 · 身价 ${market_value(p)}`);
  narr(`     当前俱乐部 ${p.club}（${p.league}）· 合同剩 ${p.contract_years} 年 · 声望 ${p.reputation}`);
  if(p.release_clause) narr(`     ⚖ 解约金已设：${fmtWan(p.release_clause)}（豪门可随时砸钱买断）`);
  if(suitors.length){ narr("  🏷 求购榜单（本赛季冬窗有意向的买家）："); for(const s of suitors.slice(0,4)) narr(`     · ${s.club}（${s.league}·${s.tag}） 预估报价 ${fmtWan(Math.round(market_value_wan(p)*s.boost))}`); }
  if(p.transfer_log.length){ narr("  📜 转会成交流水："); for(const t of p.transfer_log) narr(`     · ${t.year}年 ${t.from} → ${t.to}（${t.league}·${t.tag}） ${fmtWan(t.fee_wan)}`); }
}
function _demo_transfer_auto(p){
  if(EURO_LEAGUES.includes(p.league)) return rand()<0.7?0:2;
  if(p.reputation>=75) return 2;
  if(p.reputation>=60) return 1;
  return 0;
}
function winter_window(p){
  hr("阶段三 · 冬窗期（1月）");
  progress_check(p);
  const suitors=_transfer_suitors(p);
  const auto=Game.autopilot?_demo_transfer_auto(p):-1;
  transfer_market_view(p,suitors);
  // 违约金激活
  if(auto!==0 && p.release_clause && p.reputation>=72 && rand()<0.35){
    const big=suitors.filter(s=>s.tag==="顶级豪门").concat(suitors.slice(0,1));
    const buyer=big[0]; const trigger=p.release_clause;
    return ask("违约金被激活",[`清晨六点，${buyer.club}（${buyer.league}）直接激活了你的解约金 ${fmtWan(trigger)}！`,`经纪人把合同拍在桌上：'不用谈判了，他们砸钱买断。你的身价 ${market_value(p)}。'`],
      [("接受买断",`转会费=解约金，直接离队加盟 ${buyer.club}`),("拒绝，留在"+p.club,"违约金压不住你想留下的心")],(auto>0?0:null)).then(idx=>{
      if(idx===0){ const res={club:buyer.club,league:buyer.league,tag:buyer.tag,fee:trigger,wage:Math.round(Math.max(2,market_value_wan(p)*0.002*buyer.wage_scale)),bonus:Math.round(market_value_wan(p)*0.6),release:null,years:randint(3,5)};
        narr(`  → ${buyer.club} 支付解约金 ${fmtWan(trigger)}，买断生效！`); _apply_transfer(p,res); allocate_sp(p,0.4); return false; }
      narr("  → 你拒绝了买断。违约金条款压不住你的留下。"); p.brand=clamp(p.brand+3,0,100); return true;
    }).then(cont=>{
      if(cont===false) return;
      return _winter_transfer(p,suitors,auto);
    });
  }
  return _winter_transfer(p,suitors,auto);
}
function _winter_transfer(p,sutors,auto){
  if(auto===0 || !sutors.length){
    narr(`冬窗风平浪静。${p.club} 更衣室里有零星转会传闻，但都不涉及你。`);
    return _renew_contract(p).then(()=>allocate_sp(p,0.4));
  }
  let candidate;
  if(auto===2){ const pool=sutors.filter(s=>s.tag!=="天价土豪"); candidate=(pool.length?pool:sutors).reduce((a,b)=>a.boost>=b.boost?a:b); }
  else if(auto===1){ const pool=sutors.filter(s=>s.tag==="跳板"||s.tag==="五大中游"); candidate=(pool.length?pool:sutors).reduce((a,b)=>a.boost<=b.boost?a:b); }
  else {
    const opts=sutors.slice(0,3).map(s=>[`${s.club}（${s.league}·${s.tag}）`,`报价 ${fmtWan(Math.round(market_value_wan(p)*s.boost))}`]);
    opts.push(["留队续约","忠诚线"]);
    return ask("冬窗买家",[`${p.coach.name} 与经纪人的电话同时响了。CA ${p.ca()}，${p.age} 岁，身价 ${market_value(p)}。`],opts,0).then(idx=>{
      if(idx===opts.length-1){ return _renew_contract(p).then(()=>allocate_sp(p,0.4)); }
      candidate=sutors[idx];
      return negotiate_transfer(p,candidate,null).then(res=>{
        if(res) _apply_transfer(p,res); else { narr("  → 转会告吹。你留在俱乐部，把不甘心写进了训练里。"); return _renew_contract(p); }
      }).then(()=>allocate_sp(p,0.4));
    });
  }
  // 自动模式
  return negotiate_transfer(p,candidate,(auto>0?0:null)).then(res=>{
    if(res) _apply_transfer(p,res); else narr("  → 转会告吹。你留在俱乐部，把不甘心写进了训练里。");
    allocate_sp(p,0.4);
  });
}

/* ---------- 事件 ---------- */
function event_final_battle(p){
  hr("事件 · 赛季生死战（模板06 适配版）");
  if(p.flags["受伤中"]>0){
    narr(`你穿西装坐看台——伤病（剩 ${p.flags['受伤中']} 周）让你缺席了关键战。`);
    narr("第 85 分钟，比分僵持。你在看台上攥紧了拳头。");
    if(rand()<0.5){ narr("→ 球进了！球队赢下关键战！"); p.flags["关键功臣"]=true; }
    else { narr("→ 终场哨响，结果不理想。你把领带攥成了一团。"); p.set_mindset("焦虑",2); }
    return Promise.resolve();
  }
  return ask("第 85 分钟，0-0",[`赛季最重要一战。单刀来了，角度很小。`,`压力槽 ${p.pressure}。你的射门（${starShort(p.attr['射门'])}），队友远门柱无人盯防。`],
    [("果断打门","射门+大赛发挥-压力修正"),("横传远门柱队友","视野+决断"),("过人再造角度","盘带+技能卡")],0).then(idx=>{
    const pressure_mod=(p.pressure>=80?0.15:0);
    if(idx===0){ if(rand()<p.attr["射门"]/200+p.hidden["大赛发挥"]/400-pressure_mod){ narr("  → 进了！！！你打穿了近角！声浪淹没一切！"); p.goals+=1; p.reputation=clamp(p.reputation+20,0,100); p.national_fame=clamp(p.national_fame+25,0,100); p.set_mindset("兴奋",3); p.flags["关键功臣"]=true; } else { narr("  → 打在边网。终场哨响。更衣室死一般寂静。"); p.set_mindset("焦虑",2); p.pressure=clamp(p.pressure+10,0,100); } }
    else if(idx===1){ if(p.attr["视野"]>=80){ narr("  → 横传门前，队友推射空门！他冲过来抱住你！"); p.assists+=1; p.attr["团队合作"]=clamp(p.attr["团队合作"]+1,1,99); p.dressing=clamp(p.dressing+10,0,100); p.flags["关键功臣"]=true; } else narr("  → 传球被破坏。机会没了。"); }
    else { if(rand()<p.attr["盘带"]/220-pressure_mod){ narr("  → 牛尾巴！晃过门将推空门！这球要载入史册！"); p.goals+=1; p.reputation=clamp(p.reputation+30,0,100); p.national_fame=clamp(p.national_fame+40,0,100); p.flags["关键功臣"]=true; } else narr("  → 多带一步被铲出底线。角球没形成威胁。"); }
  });
}
function event_promise_check(p){
  if(p.flags["教练承诺"]){
    hr("剧情链兑现 · '教练承诺'");
    if(rand()<0.7){ p.trust=clamp(p.trust+10,0,100); p.role="主力"; narr("  → 教练兑现承诺：下半赛季你是主力。信任+10。"); }
    else { p.trust=clamp(p.trust-25,0,100); narr("  → 承诺跳票。新援占据你的位置。信任-25。"); p.flags["暗中操作"]=true; }
  }
  delete p.flags["教练承诺"];
}
function event_transformation(p){
  hr("事件 · 转型抉择（天选之子专属03）");
  const candidates={"高产边锋":["游弋边锋","前插攻击手"],"游弋边锋":["前插攻击手","高产边锋"],"前插攻击手":["高产边锋","游弋边锋"]}[p.playstyle]||["高产边锋"];
  const cands=candidates.filter(c=>!p.unlocked_playstyles.includes(c));
  if(!cands.length) return Promise.resolve();
  const opts=[("转型"+cands[0],"6周适应期后'版本进化'，数据回弹")];
  if(cands.length>1) opts.push(("转型"+cands[1],"另一条路"));

/* ---------- 财务 / 快照 / 经纪人 / 社媒 / 战术 / 赞助 / 青训 ---------- */
function settle_finance(p){
  const wage_income=p.wage*52;
  const brand_income=p.brand*2.5;
  const exposure_income=p.exposure*0.4;
  const sponsor_income=p.sponsor.annual||0;
  const income=wage_income+brand_income+exposure_income+sponsor_income;
  const tax=income*0.45;
  const agent_cut=income*p.agent.cut;
  const living=(10+p.brand*0.5)*(p.lifestyle+1);
  const net=income-tax-agent_cut-living;
  p.money+=net; p.total_earned+=income;
  hr("财务结算 · 赛季");
  narr(`  收入：周薪${p.wage}万×52=${wage_income.toFixed(0)} + 商业${brand_income.toFixed(0)} + 曝光${exposure_income.toFixed(0)}`+(sponsor_income?` + 赞助${sponsor_income.toFixed(0)}`:"")+` = ${income.toFixed(0)}万`);
  narr(`  支出：税${tax.toFixed(0)} + 经纪抽成${agent_cut.toFixed(0)} + 生活${living.toFixed(0)} = ${(tax+agent_cut+living).toFixed(0)}万`);
  narr(`  净入 ${net.toFixed(0)}万 → 现金 ${p.money.toFixed(0)}万（累计税前收入 ${p.total_earned.toFixed(0)}万）`);
  return ask("理财决策",["这笔钱怎么安排？经纪人列了一串方案。"],
    [("购置豪车名表","现金-25万，商业价值+12，曝光+"),("置业/稳健投资","现金-30万，投资+30万，年化 5%-15%"),("公益捐赠","现金-15万，国民度+8"),("全存银行","现金稳定，无波动")],3).then(idx=>{
    if(idx===0){ p.money-=25; p.brand+=12; p.exposure=clamp(p.exposure+8,0,100); narr("  → 车库多了台限量超跑。狗仔的镜头追着你拍。商业价值 +12。"); }
    else if(idx===1){ p.money-=30; p.investments+=30; const growth=Math.round(p.investments*uniform(0.05,0.15)); p.investments+=growth; narr(`  → 你买入一处置业与基金组合。一年后增值 ${growth}万（组合 ${p.investments.toFixed(0)}万）。`); }
    else if(idx===2){ p.money-=15; p.national_fame=clamp(p.national_fame+8,0,100); narr("  → 你捐建了一所青训学校。国民度 +8。"); }
    else narr("  → 你把钱稳稳存进银行。现金流健康。");
  });
}
function snapshot_season(p){
  const avg=p.ratings.length?(p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length):0;
  const ms=p.match_stats.filter(m=>m.year===p.year);
  const nms=ms.length;
  const agg={
    shots:nms?Math.round(ms.reduce((s,m)=>s+m.shots,0)/nms*10)/10:0,
    poss:nms?Math.round(ms.reduce((s,m)=>s+m.poss,0)/nms*10)/10:0,
    xg:nms?Math.round(ms.reduce((s,m)=>s+m.xg,0)*10)/10:0,
    avg_os:nms?Math.round(ms.reduce((s,m)=>s+m.os,0)/nms):0,
    match_data:ms,
    standings:_gen_standings(p),
    scorers:_gen_scorers(p),
  };

function _gen_standings(p){
  const teams=_league_team_names(p);
  const n=teams.length;
  const my_rank=Math.min(Math.max(p.last_rank||n,1),n);
  const rows=[];
  for(let i=0;i<teams.length;i++){
    const t=teams[i]; let rank;
    if(t===p.club) rank=my_rank;
    else { rank=i+1; if(rank>=my_rank) rank+=1; rank=Math.min(rank,n); }
    const pts=Math.max(20,88-rank*5+randint(-3,3));
    const w=randint(10,30); const d=randint(4,10); const l=Math.max(0,34-w-d);
    rows.push({rank,team:t,pts,w,d,l});
  }
  rows.sort((a,b)=>a.rank-b.rank);
  return rows;
}
function _gen_scorers(p){
  const mine=p.goals;
  const names=sample(["哈兰德","姆巴佩","凯恩","莱万","维尼修斯","萨拉赫","劳塔罗","奥斯梅恩","孙兴慜","武磊","张玉宁","谭龙","韦世豪","埃德森","若塔"],8);
  const others=[];
  for(let i=0;i<9;i++) others.push(Math.max(0,randint(mine-6,mine+4)));
  const pairs=names.map((nm,i)=>[others[i],nm]).sort((a,b)=>b[0]-a[0]);
  const scorers=pairs.map(x=>({goals:x[0],name:x[1]}));
  let inserted=false;
  for(let i=0;i<scorers.length;i++){ if(mine>scorers[i].goals||(mine===scorers[i].goals&&!inserted)){ scorers.splice(i,0,{goals:mine,name:p.name+"⭐"}); inserted=true; break; } }
  if(!inserted) scorers.push({goals:mine,name:p.name+"⭐"});
  return scorers.slice(0,6);
}

      else simulate_match(p,`${p.league}第${i}轮`);

function domestic_cup(p){
  const cup_name=(p.league==="中甲"||p.league==="中超")?"足协杯":"国内杯赛";
  hr(`杯赛 · ${cup_name}（单败淘汰）`);

  const rounds=(p.league==="中甲"||p.league==="中超")?2:3;
  let reached=0;
  return (async()=>{
    for(let r=1;r<=rounds;r++){
      const opp=choice(opp_pool(p));
      narr(`  · ${cup_name}第${r}轮 vs ${opp}（${r===rounds?'决赛前夕':''}）`);
      const g=simulate_match(p,`${cup_name}${r}轮 vs ${opp}`);
      if(g===null){ narr(`  → 你轮休未出场，球队该轮晋级。`); reached+=1; continue; }
      if(rand()<0.55+p.ca()*0.003){
        reached+=1; narr("  → 晋级！");
        if(r===rounds){ p.career["杯赛冠军"]+=1; p.honors.push(`${p.year} ${cup_name}冠军`); p.reputation=clamp(p.reputation+8,0,100); narr(`  🏆 ${cup_name}冠军到手！你举起了奖杯。`); }
      } else { narr("  → 杯赛出局。"); break; }
    }
    narr(`  ${cup_name}之旅：止步${reached<rounds?(reached+1):'冠军'}。`);
  })();
}
function stage4(p){
  hr("阶段四 · 下半赛季（2-5月）");
  event_promise_check(p);
  const n=CFG.prototype_defaults.season_matches_stage4;
  return (async()=>{
    for(let i=1;i<=n;i++){
      if(p.flags["受伤中"]>0){
        p.flags["受伤中"]-=1; p.missed+=1;
        if(p.flags["受伤中"]===0){ narr(`  [下半程第${i}轮] 伤愈，你回到了大名单。`); p.set_mindset("兴奋",1); } else narr(`  [下半程第${i}轮] 伤停恢复中（剩 ${p.flags['受伤中']} 周）。`);
        continue;
      }
      const importance=(i===n)?1:0;
      let label=(i<n)?`${p.league}第${i+18}轮`:"关键轮";
      const dr=(i===5)?derby_rival(p):null;
      if(dr) label+="·德比";
      simulate_match(p,label,importance,dr);
      if(i%5===0) await rest_decision(p);
      if(i===3||i===9) await micro_event(p);

    }

  })();
}

function check_achievements(p){
  const newA=[];
  for(const [aid,cat,ic,name,desc,cond] of _ACH_BANK){
    try{ if(cond(p)&&!p.achievements.has(aid)){ p.achievements.add(aid); p.achievement_years[aid]=p.year; newA.push(name); } }catch(e){}
  }
  for(const n of newA) narr(`  🔓 成就解锁！「${n}」`);
  return newA;
}
function unlockedList(p){
  const out=[];
  for(const [aid,cat,ic,name,desc,cond] of _ACH_BANK){
    if(p.achievements.has(aid)) out.push({id:aid,cat,icon:ic,name,desc,year:p.achievement_years[aid]});
  }
  return out;
}

function run_season(p, season){
  return stage1(p,season).then(()=>sponsor_event(p)).then(()=>stage2(p)).then(()=>winter_window(p)).then(()=>{
    p.energy=clamp(p.energy+12,0,100);

  }).then(()=>{
    if(rand()<0.25) return event_coach_change(p);
  }).then(()=>stage4(p)).then(()=>domestic_cup(p)).then(()=>{
    event_champions_league(p);
  }).then(()=>stage5(p,season)).then(()=>{
    if(p.age>=17){ event_national(p); event_qualifiers(p); event_asian_cup(p); }
    event_world_cup(p);
    event_ballon_dor(p);
    if(p.age>=27&&p.attr["速度"]<85&&rand()<0.6) return event_transformation(p);

function season_end_aging(p){
  p.age+=1; p.year+=1;
  if(p.age>=30){ for(const k in PHYSICAL_DECAY){ if(p.attr[k]&&p.attr[k]>60) p.attr[k]=clamp(p.attr[k]-1,1,99); } narr(`  岁月：速度/爆发/耐力 -1（${p.age}岁）。`); }
  if(p.age>=30&&p.age%2===0){ const grown=[]; for(const k of MENTAL_SUSTAIN){ if(p.attr[k]<96&&rand()<0.5){ p.attr[k]+=1; grown.push(k); } } if(grown.length) narr(`  精神补位：${grown.join("/")} +1（经验沉淀）。`); }
  p.season_attr_snapshot=Object.assign({},p.attr);
  p.career_goals+=p.goals; p.career_assists+=p.assists;
  p.best_season_goals=Math.max(p.best_season_goals,p.goals);
  p.brand=clamp(p.brand+(p.goals>=8?1:0)+Math.floor(p.national_fame/25),0,100);
  p.apps=p.goals=p.assists=p.missed=0; p.national_goals_season=0; p.ratings=[]; p.sp=0;
  p.energy=clamp(p.energy+40,0,100); p.fatigue=0; p.hot_streak=0; p.on_fire=0; p.state_arrow="→";
  p.contract_years=Math.max(0,p.contract_years-1);
  if(p.contract_years===0) narr(`  合同还剩最后一年——下赛季结束你就是自由身了。经纪人提醒你注意。`);
  delete p.flags["转型期"];
  for(const k of ["表演","关键功臣","黄牌","苦练"]) delete p.flags[k];
  p.form=clamp(p.form+1,1,8);
  const relax=15+Math.max(0,p.age-22)+Math.min(p.career["金球奖"],10);
  p.pressure=clamp(p.pressure-relax,0,100);
  teammate_aging(p);
}

function _axis_line(label,your,target,holder,unit,note){
  const ratio=target?Math.min(1.0,your/target):0;
  const filled=Math.round(ratio*16);
  const bar="█".repeat(filled)+"░".repeat(16-filled);
  let line=`  ${label}  你 ${your}${unit} / ${holder} ${target}${unit}   ${bar}`;
  if(ratio>=1) line+="  ◆ 已超越纪录！"; else line+=`  还差 ${target-your}${unit}`;
  if(note) line+="  · "+note;
  return line;
}

function coach_ability(p){
  let a=(p.attr["预判"]+p.attr["决断"]+p.attr["领导力"]+p.attr["镇定"]+p.attr["团队合作"])/5.0;
  a+=Math.min(p.career_goals,1200)/200.0;

function _coach_season(p,ability,tier,idx){
  hr(`执教 · 第${idx}季 · ${p.coaching.club}（${TIER_NAMES[tier]}）`);
  return ask("战术决策",[`球员们看着战术板。更衣室里挂着你球员时代的照片。`],
    [("高位逼抢","攻势足球：胜率+，失球+"),("稳守反击","务实：胜率稳，观赏性-"),("传控渗透","优雅：观众爱看，慢热")],1).then(decision=>{
    const style={0:0.04,1:0.02,2:0.0}[decision];
    const base=0.60-tier*0.06+(ability-60)/100.0*0.4+style;
    const win_rate=clamp(base+gauss(0,0.08),0.10,0.88);
    const wins=Math.round(win_rate*34);
    const draws=Math.round(uniform(4,9));
    const losses=Math.max(0,34-wins-draws);
    let rank,note;
    if(wins>=24){rank=1;note="🏆 联赛冠军！";} else if(wins>=20){rank=2;note="亚军，进欧冠区。";} else if(wins>=15){rank=(rand()<0.5?5:6);note="欧战区边缘。";} else {rank=randint(8,16);note="中下游，球迷开始倒戈。";}
    narr(`  联赛：${wins}胜 ${draws}平 ${losses}负 → 第 ${rank} 名。${note}`);
    if(rank===1){ p.coaching.trophies.push(`${p.year} ${p.coaching.club} 联赛冠军`); narr("  ★ 你把冠军奖杯举过头顶——这感觉，和当年踢球时一样。"); }
    const cup_chance=0.12+(ability-50)/200.0+(rank<=2?0.08:0);
    if(rand()<cup_chance){ p.coaching.trophies.push(`${p.year} ${p.coaching.club} 国内杯赛冠军`); narr("  ★ 国内杯赛捧杯！你的战术板被印上了报纸头版。"); }
    if(tier===2&&rank<=2&&rand()<0.14+(ability-60)/400.0){ p.coaching.trophies.push(`${p.year} 欧冠冠军（执教）`); narr("  🏆 你以主帅身份登顶欧洲！大耳朵杯的光，二十年后再次照亮了你。"); }
    p.coaching.wins+=wins; p.coaching.seasons+=1; p.coaching.trophies_count=p.coaching.trophies.length;
    p.coaching.salary+=TIER_SALARY[tier]+Math.round((ability-50)*5);
    p.year+=1;
    return rank;
  });
}

      narr(`身高187cm | 颜值99 | 惯用脚右脚(弱足4星) | PA 99(隐藏) | 初始CA ${p.ca()}`);
      narr("基因技能卡：马赛回旋/电梯球/踩单车/牛尾巴/外脚背/挑球过人/诈术");
      narr(`阵型起点：徐根宝 4-4-2 边路传中 → 你的兼容度 ${p.playstyle_compat()}`);
      return p;
    });
  });
}

/* ---------- 存档 ---------- */
function serialize(p){
  return JSON.stringify({name:p.name,age:p.age,year:p.year,player:(()=>{const o={};for(const k in p){if(k!=="achievements")o[k]=p[k];}o.achievements=Array.from(p.achievements);return o;})()});
}
function snapshotKey(p){ return `tianxuan_${p.name}_${p.year}`; }
function saveGame(p){
  try{ localStorage.setItem(Game.saveKey,serialize(p)); return true; }catch(e){ return false; }
}
function loadGame(){
  try{
    const raw=localStorage.getItem(Game.saveKey);
    if(!raw) return null;
    const d=JSON.parse(raw);
    const p=Object.assign(new Player(d.name,d.player.playstyle,"C罗"),d.player);
    p.achievements=new Set(p.achievements||[]);
    for(const k in d.player) p[k]=d.player[k];
    return p;
  }catch(e){ return null; }
}

/* ---------- Game 状态机 ---------- */
const Game={
  autopilot:false,
  interactive:true,
  p:null,
  season:0,
  running:false,
  saveKey:"tianxuan_save_v1",
  togglePanel(){
    if(!this.p) return;
    panel(this.p.panel());
  },
  updateTop(){
    const el=document.getElementById("topstats");
    if(!el) return;
    if(!this.p){ el.innerHTML=`<span class="big">新游戏</span>`; return; }
    const p=this.p;
    el.innerHTML=`<div class="big">${p.year}年 · ${p.age}岁 · ${p.club}</div>${p.apps}场 ${p.goals}球 · CA${p.ca()} · 身价${p.value||'—'}`;
  },
  async startFromCreation(){
    this.running=true; this.season=0;
    const p=await creation();
    this.p=p;
    await this.runCareer(p);
  },
  async runCareer(p){
    for(let s=1;s<=999;s++){
      if(p.age>=40) break;
      this.season=s; this.updateTop();
      hr(`══════ 赛季 ${s} · ${p.year} 赛季 ══════`);
      await run_season(p,s);
      this.updateTop();
    }
    await retirement(p);
    this.updateTop();
    this.finalScreen(p);
  },
  finalScreen(p){
    hr("生涯终局 · 存档与再启");
    ask("生涯结束",[`${p.name} 的传奇落幕。你可以保存这份生涯，或开启新的故事。`],
      [("💾 保存存档","写入浏览器本地"),("🔄 再来一局","回到球员创建"),("📋 查看状态","回看最终面板")],0).then(idx=>{
      if(idx===0){ const ok=saveGame(p); narr(ok?"  ✅ 存档已保存。":"  ✕ 保存失败（存储不可用）。"); }
      else if(idx===1){ this.restart(); return; }
      else panel(p.panel());
      this.finalScreen(p);
    });
  },
  restart(){
    this.running=false;
    logEl.innerHTML="";
    this.startFromCreation();
  },
  save(){ if(this.p){ const ok=saveGame(this.p); narr(ok?"  💾 已保存到浏览器。":"  ✕ 保存失败。"); } },
  async boot(){
    const saved=loadGame();
    if(saved){
      this.p=saved; this.updateTop();
      await ask("继续生涯",[`发现存档：${saved.name}（${saved.age}岁 · ${saved.year}年 · ${saved.club}）。我要继续他的故事。`],
        [("继续生涯","从当前进度接着玩"),("新游戏","重新创建球员")],0).then(async idx=>{
        if(idx===0){ await this.runCareer(saved); } else { logEl.innerHTML=""; await this.startFromCreation(); }
      });
    } else {
      await this.startFromCreation();
    }
  }
};
Game.boot();
</script>
